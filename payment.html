<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment | FixAm Lagos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-white">
  
  <nav class="navbar navbar-expand-lg site-navbar">

    <div class="container">

      <a
        class="navbar-brand"
        href="index.html">

        <i class="fa-solid fa-screwdriver-wrench"></i>
        FixAm Lagos

      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav">

        <i class="fa-solid fa-bars"></i>

      </button>

      <div
        class="collapse navbar-collapse"
        id="navbarNav">

        <ul class="navbar-nav ms-auto">

          <li class="nav-item">
            <a
              class="nav-link"
              href="index.html">
              Home
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link"
              href="dashboard-pro.html">
              Dashboard
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link"
              href="contact.html">
              Contact
            </a>
          </li>

        </ul>

      </div>

    </div>

  </nav>


  <section class="py-5">

    <div class="container">

      <div class="row justify-content-center">

        <div class="col-lg-6">

          <div class="glass-card p-4 p-md-5 text-center">

            <div class="mb-3">

              <i
                class="fa-solid fa-credit-card fa-3x text-info">
              </i>

            </div>

            <h2>
              Professional Registration Fee
            </h2>

            <p class="text-secondary">
              Payment is required before you can post a job.
            </p>


            <div class="my-4">

              <h1 class="text-info">
                ₦10,000
              </h1>

              <p class="text-secondary">
                One payment allows you to post one job.
              </p>

            </div>


            <div class="alert alert-info text-start">

              <i class="fa-solid fa-circle-info me-2"></i>

              You will be redirected to the secure payment
              service to complete your payment.

            </div>


            <button
              type="button"
              id="payNowButton"
              class="btn btn-primary w-100">

              <i class="fa-solid fa-lock me-2"></i>

              Pay ₦10,000

            </button>


            <a
              href="dashboard-pro.html"
              class="btn btn-outline-secondary w-100 mt-3">

              Back to Dashboard

            </a>

          </div>

        </div>

      </div>

    </div>

  </section>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>

</html>
