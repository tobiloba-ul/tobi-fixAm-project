<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register as a Client | FixAm Lagos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-black text-white">
  <nav class="navbar navbar-expand-lg site-navbar">

    <div class="container">

      <a
        class="navbar-brand"
        href="index.html">

        <i class="fa-solid fa-screwdriver-wrench"></i>
        FixAm Lagos
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav">

        <i class="fa-solid fa-bars"></i>

      </button>

      <div
        class="collapse navbar-collapse"
        id="navbarNav">

        <ul class="navbar-nav ms-auto">

          <li class="nav-item">
            <a
              class="nav-link"
              href="index.html">
              Home
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link"
              href="find.html">
              Find Professional
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link"
              href="login.html">
              Login
            </a>
          </li>

        </ul>

      </div>

    </div>

  </nav>


  <section class="py-5">

    <div class="container">

      <div class="row justify-content-center">

        <div class="col-lg-7">

          <div class="glass-card p-4 p-md-5">

            <div class="text-center mb-4">

              <div class="mb-3">

                <i
                  class="fa-solid fa-user-plus fa-3x text-info">
                </i>

              </div>

              <h2>
                Create Client Account
              </h2>

              <p class="text-secondary">
                Create an account to find and hire trusted professionals.
              </p>

            </div>


            <form id="clientRegisterForm">

              <div class="mb-3">

                <label
                  class="form-label">
                  Full Name
                </label>

                <div class="input-group">

                  <span class="input-group-text">
                    <i class="fa-solid fa-user"></i>
                  </span>

                  <input
                    type="text"
                    id="clientName"
                    class="form-control"
                    placeholder="Enter your full name"
                    required>

                </div>

              </div>


              <div class="mb-3">

                <label
                  class="form-label">
                  Gmail / Email
                </label>

                <div class="input-group">

                  <span class="input-group-text">
                    <i class="fa-solid fa-envelope"></i>
                  </span>

                  <input
                    type="email"
                    id="clientEmail"
                    class="form-control"
                    placeholder="Enter your email"
                    required>

                </div>

              </div>


              <div class="mb-3">

                <label
                  class="form-label">
                  Phone Number
                </label>

                <div class="input-group">

                  <span class="input-group-text">
                    <i class="fa-solid fa-phone"></i>
                  </span>

                  <input
                    type="tel"
                    id="clientPhone"
                    class="form-control"
                    placeholder="Enter your phone number"
                    required>

                </div>

              </div>


              <div class="mb-3">

                <label
                  class="form-label">
                  Location
                </label>

                <select
                  id="clientLocation"
                  class="form-select"
                  required>

                  <option value="">
                    Select your location
                  </option>

                  <option value="Ikeja">
                    Ikeja
                  </option>

                  <option value="Yaba">
                    Yaba
                  </option>

                  <option value="Lekki">
                    Lekki
                  </option>

                  <option value="Victoria Island">
                    Victoria Island
                  </option>

                  <option value="Surulere">
                    Surulere
                  </option>

                  <option value="Maryland">
                    Maryland
                  </option>

                  <option value="Other">
                    Other
                  </option>

                </select>

              </div>


              <div class="mb-3">

                <label
                  class="form-label">
                  Address
                </label>

                <div class="input-group">

                  <span class="input-group-text">
                    <i class="fa-solid fa-location-dot"></i>
                  </span>

                  <input
                    type="text"
                    id="clientAddress"
                    class="form-control"
                    placeholder="Enter your address"
                    required>

                </div>

              </div>

              <div class="mb-3">

                <label
                  class="form-label">
                  Password
                </label>

                <div class="input-group">

                  <span class="input-group-text">
                    <i class="fa-solid fa-lock"></i>
                  </span>

                  <input
                    type="password"
                    id="clientPassword"
                    class="form-control"
                    placeholder="Create a password"
                    required>

                </div>

              </div>


              <div class="mb-4">

                <label
                  class="form-label">
                  Confirm Password
                </label>

                <div class="input-group">

                  <span class="input-group-text">
                    <i class="fa-solid fa-lock"></i>
                  </span>

                  <input
                    type="password"
                    id="clientConfirmPassword"
                    class="form-control"
                    placeholder="Confirm your password"
                    required>

                </div>

              </div>


              <button
                type="submit"
                class="btn btn-primary w-100">

                <i class="fa-solid fa-user-plus me-2"></i>

                Create Client Account

              </button>


              <p class="text-center text-secondary mt-4 mb-0">

                Already have an account?

                <a
                  href="login.html"
                  class="text-info text-decoration-none">

                  Login

                </a>

              </p>

            </form>

          </div>

        </div>

      </div>

    </div>

  </section>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
